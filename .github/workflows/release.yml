name: Build and Release Clean Portable App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-portable:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.9'

    # ==================== WINDOWS BUILD ====================
    - name: Build Trimmed Portable Bundle (no compiled exe)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        # Create target directory structure for the portable app
        New-Item -ItemType Directory -Force -Path dist/MYOblue-GUI/python | Out-Null

        # Copy clean system Python binaries into our portable folder
        $sys_python_dir = Split-Path (Get-Command python.exe).Source
        Copy-Item -Path "$sys_python_dir\*" -Destination dist/MYOblue-GUI/python/ -Recurse -Force

        # Move inside the portable Python environment
        Set-Location dist/MYOblue-GUI/python

        # Configure Python environment paths to look into site-packages locally
        $pth = Get-ChildItem -Path . -Filter "python3*._pth" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($pth) {
          Set-Content -Path $pth.FullName -Value @("python312.zip", ".", "Lib", "Lib\site-packages", "import site")
        }

        # Upgrade pip inside the portable environment
        ./python.exe -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE" }
        
        # Define and install required application dependencies
        $packages = @(
          "PyQt5==5.15.10",
          "numpy==1.26.4",
          "scipy==1.13.1",
          "pyserial==3.5",
          "pyqtgraph==0.13.7"
        )
        ./python.exe -m pip install $packages
        if ($LASTEXITCODE -ne 0) { throw "pip install failed with exit code $LASTEXITCODE" }

        # Helper function to print directory size in logs
        function Get-TreeStats($path) {
          $items = Get-ChildItem -Path $path -Recurse -File -ErrorAction SilentlyContinue
          $count = ($items | Measure-Object).Count
          $sizeMB = [math]::Round((($items | Measure-Object -Property Length -Sum).Sum) / 1MB, 1)
          return "$count files, $sizeMB MB"
        }
        Write-Host "Before trim: $(Get-TreeStats '.')"

        # ---- 1. Remove unused components from Python standard library ----
        foreach ($p in @("Lib\test", "Lib\idlelib", "Lib\tkinter", "tcl", "Doc", "Lib\site-packages\pip", "Lib\site-packages\setuptools")) {
          if (Test-Path $p) { Remove-Item -Path $p -Recurse -Force }
        }

        # ---- 2. Delete test directories and bytecode caches from all packages ----
        Get-ChildItem -Path "Lib\site-packages" -Recurse -Directory -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -in @("tests", "testing", "test", "__pycache__") } |
          Sort-Object FullName -Descending |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

        # ---- 3. Remove heavy PyQt5 internal tools, plugins, and developer examples ----
        $qtRoot = Get-ChildItem -Path "Lib\site-packages\PyQt5" -Directory -Filter "Qt*" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($qtRoot) {
          $qtTrim = @(
            "qml", "translations", "examples", "plugins\imageformats", "plugins\iconengines", "plugins\audio",
            "plugins\platforms\qminimal.dll", "plugins\platforms\qoffscreen.dll",
            "bin\designer.exe", "bin\linguist.exe", "bin\lrelease.exe", "bin\lupdate.exe", "bin\lconvert.exe", 
            "bin\assistant.exe", "bin\qmlscene.exe", "bin\qtdiag.exe", "bin\qtplugininfo.exe",
            "plugins\sqldrivers", "plugins\bearer", "plugins\canbus", "plugins\designer", "plugins\gamepads", 
            "plugins\generic", "plugins\geometryloaders", "plugins\geoservices", "plugins\mediaservice", 
            "plugins\playlistformats", "plugins\position", "plugins\printsupport", "plugins\sensorgestures", 
            "plugins\sensors", "plugins\texttospeech", "plugins\videonode", "plugins\webview"
          )
          foreach ($p in $qtTrim) {
            $full = Join-Path $qtRoot.FullName $p
            if (Test-Path $full) { Remove-Item -Path $full -Recurse -Force }
          }
        }

        # ---- 4. Delete unused PyQt5 binary modules (.pyd) and corresponding Qt DLLs ----
        # Keeping only QtCore, QtWidgets, and QtGui as specified by app imports
        $unusedQtModules = @(
          "QtNetwork","QtSql","QtMultimedia","QtMultimediaWidgets","QtQml","QtQuick",
          "QtQuickWidgets","QtPositioning","QtSensors","QtBluetooth","QtNfc",
          "QtPrintSupport","QtWebSockets","QtWebChannel","QtDesigner","QtHelp","QtTest",
          "Qt3DCore","Qt3DRender","Qt3DInput","Qt3DLogic","Qt3DAnimation","Qt3DExtras",
          "QtSerialPort","QtRemoteObjects","QtScxml","QtTextToSpeech","QtWebView",
          "Gamepad","QtLocation","QtXml","QtXmlPatterns","QtDBus","QtSvg","QtOpenGL",
          "QtNetworkAuth","QtChart"
        )
        foreach ($name in $unusedQtModules) {
          $pyd = Join-Path "Lib\site-packages\PyQt5" "$name.pyd"
          if (Test-Path $pyd) { Remove-Item $pyd -Force }
          if ($qtRoot) {
            $dllName = "Qt5" + $name.Substring(2)
            $dll = Join-Path $qtRoot.FullName "bin\$dllName.dll"
            if (Test-Path $dll) { Remove-Item $dll -Force }
          }
        }

        # ---- 5. Optimize SciPy & pyqtgraph (Stripping heavy CPU-unused modules) ----
        # Keeping signal, fftpack, linalg, and special features required by the app internally
        $scipyPath = "Lib\site-packages\scipy"
        if (Test-Path $scipyPath) {
          $scipyTrim = @(
            "cluster", "datasets", "integrate", "interpolate", "io", 
            "ndimage", "odr", "optimize", "spatial", "stats", "_lib\tests"
          )
          foreach ($p in $scipyTrim) {
            $full = Join-Path $scipyPath $p
            if (Test-Path $full) { Remove-Item -Path $full -Recurse -Force }
          }
        }

        # Clean up pyqtgraph internal developer tools
        $pqgCompiler = "Lib\site-packages\pyqtgraph\compiler"
        if (Test-Path $pqgCompiler) { Remove-Item -Path $pqgCompiler -Recurse -Force }

        # ---- 6. Remove C header files (.h/.pxd) left from package compilation ----
        Get-ChildItem -Path "Lib\site-packages" -Recurse -Filter "*.h" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
        Get-ChildItem -Path "Lib\site-packages" -Recurse -Filter "*.pxd" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

        Write-Host "After ultra trim: $(Get-TreeStats '.')"

        # Move up to dist/MYOblue-GUI to assemble application source files
        Set-Location ..
        
        # Copy main script files and resources from the repository root
        Copy-Item ../../MYOblue_GUI.py -Destination ./python/
        if (Test-Path ../../config.ini) { Copy-Item ../../config.ini -Destination ./ }
        if (Test-Path ../../img) { Copy-Item -Path ../../img -Destination ./img -Recurse -Force }

        # ---- 7. Create a debugging Windows .bat launcher ----
        # Using a safe here-string format to prevent syntax errors in CMD
        $batContent = @"
@echo off
set "APP_DIR=%~dp0"
cd /d "%APP_DIR%python"
"%APP_DIR%python\python.exe" "%APP_DIR%python\MYOblue_GUI.py"
if %errorlevel% neq 0 (
    echo.
    echo --------------------------------------------------
    echo CRITICAL ERROR: Python script crashed!
    echo Error Code: %errorlevel%
    echo --------------------------------------------------
    pause
)
"@
        Set-Content -Path "Run_MYOblue_GUI.bat" -Value $batContent -Encoding ASCII

        # Move back to repository root and pack the application bundle into a ZIP archive
        Set-Location ../..
        tar -a -c -f MYOblue_GUI_Windows.zip -C dist MYOblue-GUI

        if (-not (Test-Path MYOblue_GUI_Windows.zip)) {
          throw "Build did not produce MYOblue_GUI_Windows.zip"
        }

    # ==================== PUBLISH RELEASE ====================
    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          MYOblue_GUI_Windows.zip
        body: |
          Portable distribution package for Windows (64-bit).
          Extract the ZIP and double-click Run_MYOblue_GUI.bat to run - no installation needed.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
