name: Build and Release Clean Portable App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-portable:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.9'

    # ==================== WINDOWS BUILD ====================
    - name: Build Minimal Portable Bundle
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $packages = @(
          "PyQt5==5.15.10",
          "numpy==1.26.4",
          "scipy==1.13.1",
          "pyserial==3.5",
          "pyqtgraph==0.13.7",
          "pyinstaller==6.10.0"
        )
        python -m pip install --upgrade pip
        if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed with exit code $LASTEXITCODE" }
        python -m pip install @packages
        if ($LASTEXITCODE -ne 0) { throw "pip install failed with exit code $LASTEXITCODE" }

        # --onedir (not --onefile): no self-extracting temp-unpack at runtime, which is
        # the main behavior Defender/SmartScreen heuristics flag on PyInstaller builds.
        # PyInstaller's import-graph analysis (modulegraph) automatically includes only
        # what MYOblue_GUI.py actually reaches - correctly handling scipy's internal
        # cross-imports instead of us guessing which files are "safe" to delete.
        #
        # --exclude-module drops PyQt5 submodules the app never imports (QtCore/QtGui/
        # QtWidgets only, per the source): networking, SQL, multimedia, QML/Quick,
        # positioning/sensors/bluetooth/nfc, print support, dev tools, 3D, web, etc.
        $excludes = @(
          "PyQt5.QtNetwork", "PyQt5.QtSql", "PyQt5.QtMultimedia", "PyQt5.QtMultimediaWidgets",
          "PyQt5.QtQml", "PyQt5.QtQuick", "PyQt5.QtQuickWidgets", "PyQt5.QtPositioning",
          "PyQt5.QtSensors", "PyQt5.QtBluetooth", "PyQt5.QtNfc", "PyQt5.QtHelp", "PyQt5.QtTest",
          "PyQt5.QtXml", "PyQt5.QtXmlPatterns", "PyQt5.QtDBus", "PyQt5.QtPrintSupport",
          "PyQt5.QtDesigner", "PyQt5.QtWebSockets", "PyQt5.QtWebChannel",
          "PyQt5.QtWebEngineWidgets", "PyQt5.QtSerialPort", "PyQt5.QtRemoteObjects",
          "PyQt5.QtScxml", "PyQt5.QtLocation", "PyQt5.QtTextToSpeech", "PyQt5.QAxContainer",
          "PyQt5.QtWinExtras", "PyQt5.Qt3DCore", "PyQt5.Qt3DRender", "PyQt5.Qt3DInput",
          "PyQt5.Qt3DLogic", "PyQt5.Qt3DAnimation", "PyQt5.Qt3DExtras", "PyQt5.QtWebView",
          "PyQt5.QtGamepad", "tkinter"
        )
        $excludeArgs = @()
        foreach ($m in $excludes) { $excludeArgs += "--exclude-module"; $excludeArgs += $m }

        $pyinstallerArgs = @(
          "--onedir",
          "--noupx",
          "--windowed",
          "--name", "MYOblue_GUI",
          "--add-data", "img;img"
        ) + $excludeArgs + @("MYOblue_GUI.py")

        pyinstaller @pyinstallerArgs
        if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed with exit code $LASTEXITCODE" }

        # config.ini stays external (not bundled) so users can edit it directly
        Copy-Item config.ini -Destination dist\MYOblue_GUI\

        function Get-TreeStats($path) {
          $items = Get-ChildItem -Path $path -Recurse -File -ErrorAction SilentlyContinue
          $count = ($items | Measure-Object).Count
          $sizeMB = [math]::Round((($items | Measure-Object -Property Length -Sum).Sum) / 1MB, 1)
          return "$count files, $sizeMB MB"
        }
        Write-Host "Final bundle: $(Get-TreeStats 'dist\MYOblue_GUI')"

        tar -a -c -f MYOblue_GUI_Windows.zip -C dist MYOblue_GUI

        if (-not (Test-Path MYOblue_GUI_Windows.zip)) {
          throw "Build did not produce MYOblue_GUI_Windows.zip"
        }

    # ==================== PUBLISH RELEASE ====================
    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          MYOblue_GUI_Windows.zip
        body: |
          Portable distribution package for Windows (64-bit).
          Extract the ZIP and double-click MYOblue_GUI.exe to run - no installation needed.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
