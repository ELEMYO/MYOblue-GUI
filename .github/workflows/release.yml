name: Build and Release Clean Portable App
on:
  push:
    tags:
      - 'v*'
jobs:
  build-portable:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ==================== WINDOWS BUILD ====================
    - name: Build Clean Windows Bundle
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        # Enforce secure TLS 1.2 protocol for network operations
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

        New-Item -ItemType Directory -Force -Path dist/MYOblue-GUI/python | Out-Null

        # Deploy isolated embeddable Python runtime environment via WebClient to avoid curl shell aliases
        $pythonVersion = "3.12.4"
        $pythonUrl = "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip"
        (New-Object System.Net.WebClient).DownloadFile($pythonUrl, 'python-embed.zip')
        Expand-Archive -Path python-embed.zip -DestinationPath dist/MYOblue-GUI/python
        Remove-Item python-embed.zip

        # Enable local site-packages isolation in embeddable configuration
        cd dist/MYOblue-GUI/python
        $pth = Get-ChildItem *.pth | Select-Object -First 1
        (Get-Content $pth) -replace '#import site', 'import site' | Set-Content $pth

        # Bootstrap internal pip package manager for runtime dependencies
        (New-Object System.Net.WebClient).DownloadFile('https://bootstrap.pypa.io/get-pip.py', 'get-pip.py')
        ./python.exe get-pip.py --no-warn-script-location
        if ($LASTEXITCODE -ne 0) { throw "get-pip.py failed with exit code $LASTEXITCODE" }
        Remove-Item get-pip.py

        # Install heavy scientific and UI dependencies locally (pin versions for reproducibility)
        ./python.exe -m pip install `
          PyQt5==5.15.10 `
          numpy==1.26.4 `
          scipy==1.13.1 `
          pyserial==3.5 `
          pyqtgraph==0.13.7
        if ($LASTEXITCODE -ne 0) { throw "pip install failed with exit code $LASTEXITCODE" }

        cd ..
        # Restructure bundle: move source code to environment, keep assets in root
        Copy-Item ../../MYOblue_GUI.py -Destination ./python/
        Copy-Item ../../config.ini -Destination ./
        Copy-Item -Path ../../img -Destination ./img -Recurse -Force

        # Generate a portable batch launcher (relative to its own location via %~dp0)
        # This resolves correctly no matter where the user extracts the zip,
        # unlike a .lnk shortcut built with %CD%, which is not reliably reevaluated on double-click.
        $launcher = @'
@echo off
cd /d "%~dp0"
start "" "%~dp0python\pythonw.exe" "%~dp0python\MYOblue_GUI.py"
'@
        Set-Content -Path "Start_MYOblue_GUI.bat" -Value $launcher -Encoding ASCII

        cd ../..
        Compress-Archive -Path dist/MYOblue-GUI -DestinationPath MYOblue_GUI_Windows.zip

    # ==================== MACOS BUILD (FOR THE FUTURE) ====================
    - name: Build macOS Bundle
      if: matrix.os == 'macos-latest'
      run: |
        echo "macOS build is temporarily disabled"

    # ==================== LINUX BUILD (FOR THE FUTURE) ====================
    - name: Build Linux Bundle
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Linux build is temporarily disabled"

    # ==================== PUBLISH RELEASE ====================
    - name: Upload Artifacts to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          MYOblue_GUI_Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
