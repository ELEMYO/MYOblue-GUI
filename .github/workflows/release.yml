name: Build and Release Clean Portable App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-portable:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ==================== WINDOWS BUILD ====================
    - name: Build Clean Windows Bundle
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path dist/MYOblue-GUI/python | Out-Null

        # Force foreground synchronous download using reliable BITS service
        Start-BitsTransfer -Source 'https://python.org' -Destination 'python-embed.zip'
        Expand-Archive -Path python-embed.zip -DestinationPath dist/MYOblue-GUI/python
        Remove-Item python-embed.zip

        # Enable local site-packages isolation in embeddable configuration
        cd dist/MYOblue-GUI/python
        $pth = Get-ChildItem *.pth | Select-Object -First 1
        (Get-Content $pth) -replace '#import site', 'import site' | Set-Content $pth

        # Force synchronous download for pip installer
        cd ../../..
        Start-BitsTransfer -Source 'https://pypa.io' -Destination 'dist/MYOblue-GUI/python/get-pip.py'
        
        cd dist/MYOblue-GUI/python
        ./python.exe get-pip.py --no-warn-script-location
        Remove-Item get-pip.py

        # Install dependencies inside the isolated environment
        ./python.exe -m pip install PyQt5 numpy scipy pyserial pyqtgraph
        
        cd ..

        # Restructure bundle files safely
        Copy-Item ../../MYOblue_GUI.py -Destination ./python/
        Copy-Item ../../config.ini -Destination ./
        Copy-Item -Path ../../img -Destination ./img -Recurse -Force

        # Generate a truly portable Windows launch shortcut (.lnk)
        $WshShell = New-Object -ComObject WScript.Shell
        $Shortcut = $WshShell.CreateShortcut("$PWD\Start_MYOblue_GUI.lnk")
        
        $Shortcut.TargetPath = "%CD%\python\pythonw.exe"
        $Shortcut.Arguments = "`"%CD%\python\MYOblue_GUI.py`""
        $Shortcut.WorkingDirectory = "%CD%"
        $Shortcut.IconLocation = "%CD%\python\pythonw.exe, 0"
        $Shortcut.Save()

        cd ../..
        
        # Archive using native tar tool compatible with Node 24
        tar -a -c -f MYOblue_GUI_Windows.zip -C dist MYOblue-GUI

    # ==================== MACOS BUILD (FOR THE FUTURE) ====================
    - name: Build macOS Bundle
      if: matrix.os == 'macos-latest'
      run: |
        echo "macOS build is temporarily disabled"

    # ==================== LINUX BUILD (FOR THE FUTURE) ====================
    - name: Build Linux Bundle
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Linux build is temporarily disabled"

    # ==================== PUBLISH RELEASE ====================
    - name: Upload Artifacts to Release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const tag = context.ref.replace('refs/tags/', '');
          
          let release;
          try {
            const response = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            release = response.data;
          } catch (error) {
            const response = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `MYOblue-GUI Release ${tag}`,
              body: 'Portable distribution package for Windows (64-bit). Extract the ZIP and double-click Start_MYOblue_GUI.lnk to run.',
              draft: false,
              prerelease: false
            });
            release = response.data;
          }
          
          const filePath = path.join(process.env.GITHUB_WORKSPACE, 'MYOblue_GUI_Windows.zip');
          await github.rest.repos.uploadReleaseAsset({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.id,
            name: 'MYOblue_GUI_Windows.zip',
            data: fs.readFileSync(filePath)
          });
