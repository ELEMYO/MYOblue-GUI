name: Build and Release Clean Portable App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-portable:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ==================== WINDOWS BUILD ====================
    - name: Build Clean Windows Bundle
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path dist/MYOblue-GUI/python | Out-Null

        # Step 1: Download official Python embeddable package
        Start-BitsTransfer -Source 'https://python.org' -Destination 'python-embed.zip'
        Expand-Archive -Path python-embed.zip -DestinationPath dist/MYOblue-GUI/python -Force
        Remove-Item python-embed.zip

        # Step 2: Download and bootstrap pip manager temporarily to install libraries
        cd dist/MYOblue-GUI/python
        (New-Object System.Net.WebClient).DownloadFile('https://pypa.io', 'get-pip.py')
        ./python.exe get-pip.py --no-warn-script-location
        Remove-Item get-pip.py

        # Step 3: Enable site-packages temporarily to allow pip installation
        (Get-Content python312._pth) -replace '#import site', 'import site' | Set-Content python312._pth

        # Step 4: Install exact stack of required scientific and UI dependencies
        ./python.exe -m pip install PyQt5 numpy scipy pyserial pyqtgraph

        # Step 5: COMPRESSION TRICK - Pack installed libraries into a single ZIP archive
        cd Lib/site-packages
        tar -a -c -f ../../site-packages.zip *
        
        # Step 6: Clean up thousands of unzipped small files from the runner disk
        cd ../..
        Remove-Item -Path Lib -Recurse -Force
        Remove-Item -Path Scripts -Recurse -Force
        Remove-Item -Path pip* -Recurse -Force

        # Step 7: Update Python path mapping to read libraries directly from the ZIP file
        # This keeps the final application completely transparent to the user
        echo "site-packages.zip" | Out-File -FilePath python312._pth -Append -Encoding ascii

        cd ../../..

        # Step 8: Restructure bundle files safely
        Copy-Item MYOblue_GUI.py -Destination dist/MYOblue-GUI/python/
        Copy-Item config.ini -Destination dist/MYOblue-GUI/
        Copy-Item -Path img -Destination dist/MYOblue-GUI/img -Recurse -Force

        # Step 9: Generate truly portable Windows launch shortcut (.lnk)
        $WshShell = New-Object -ComObject WScript.Shell
        $Shortcut = $WshShell.CreateShortcut("$PWD\dist\MYOblue-GUI\Start_MYOblue_GUI.lnk")
        
        $Shortcut.TargetPath = "%CD%\python\pythonw.exe"
        $Shortcut.Arguments = "`"%CD%\python\MYOblue_GUI.py`""
        $Shortcut.WorkingDirectory = "%CD%"
        $Shortcut.IconLocation = "%CD%\python\pythonw.exe, 0"
        $Shortcut.Save()

        cd dist
        
        # Step 10: Archive user-ready distribution package via system tar
        tar -a -c -f ../MYOblue_GUI_Windows.zip MYOblue-GUI

    # ==================== PUBLISH RELEASE ====================
    - name: Upload Artifacts to Release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const tag = context.ref.replace('refs/tags/', '');
          
          let release;
          try {
            const response = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            release = response.data;
          } catch (error) {
            const response = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `MYOblue-GUI Release ${tag}`,
              body: 'High-speed portable package for Windows (64-bit). Extract the ZIP instantly and double-click Start_MYOblue_GUI.lnk to run.',
              draft: false,
              prerelease: false
            });
            release = response.data;
          }
          
          const filePath = path.join(process.env.GITHUB_WORKSPACE, 'MYOblue_GUI_Windows.zip');
          await github.rest.repos.uploadReleaseAsset({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.id,
            name: 'MYOblue_GUI_Windows.zip',
            data: fs.readFileSync(filePath)
          });
