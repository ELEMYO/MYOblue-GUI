name: Build and Release Clean Portable App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-portable:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 1: Use official GitHub action to safely get a verified Python binary (bypasses network blocks)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.9'

    # ==================== WINDOWS BUILD ====================
    - name: Build Clean Windows Bundle
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        # Step 2: Create pristine directory structure
        New-Item -ItemType Directory -Force -Path dist/MYOblue-GUI/python | Out-Null

        # Step 3: Copy the pre-installed secure Python runtime files from GitHub cache
        $sys_python_dir = Split-Path (Get-Command python.exe).Source
        Copy-Item -Path "$sys_python_dir\*" -Destination dist/MYOblue-GUI/python/ -Recurse -Force

        # Step 4: Install precise stack of required project dependencies locally
        dist/MYOblue-GUI/python/python.exe -m pip install --upgrade pip
        dist/MYOblue-GUI/python/python.exe -m pip install PyQt5 numpy scipy pyserial pyqtgraph
        
        # Step 5: COMPRESSION TRICK - Pack 14,000+ unzipped dependency files into a single ZIP archive
        cd dist/MYOblue-GUI/python/Lib/site-packages
        tar -a -c -f ../../site-packages.zip *
        
        # Clean up ONLY external third-party small files from the runner disk to keep layout pristine
        cd ../..
        Remove-Item -Path Lib/site-packages -Recurse -Force
        Remove-Item -Path Scripts -Recurse -Force
        Remove-Item -Path pip* -Recurse -Force

        # Step 6: Create path configuration mapping so the Python binary reads libraries directly from the ZIP
        # Include standard paths alongside the zip package to prevent encodings/abc file lockups
        @'
python312.dll
.
Lib
site-packages.zip
import site
'@ | Out-File -FilePath python312._pth -Encoding ascii

        # Step 7: Restructure the bundle files safely from within the application folder
        cd .. # Now we are inside dist/MYOblue-GUI
        Copy-Item ../../MYOblue_GUI.py -Destination ./python/
        Copy-Item ../../config.ini -Destination ./
        Copy-Item -Path ../../img -Destination ./img -Recurse -Force

        # Step 8: Generate a truly portable Windows launch shortcut (.lnk) directly in the final user root
        $WshShell = New-Object -ComObject WScript.Shell
        $Shortcut = $WshShell.CreateShortcut("$PWD\Start_MYOblue_GUI.lnk")
        
        # %CD% is evaluated by Windows at runtime on the user's PC, keeping paths dynamic
        $Shortcut.TargetPath = "%CD%\python\pythonw.exe"
        $Shortcut.Arguments = "`"%CD%\python\MYOblue_GUI.py`""
        $Shortcut.WorkingDirectory = "%CD%"
        $Shortcut.IconLocation = "%CD%\python\pythonw.exe, 0"
        $Shortcut.Save()

        # Step 9: Archive the final user package using system tar tool
        cd ../..
        tar -a -c -f MYOblue_GUI_Windows.zip -C dist MYOblue-GUI

    # ==================== MACOS BUILD (FOR THE FUTURE) ====================
    - name: Build macOS Bundle
      if: matrix.os == 'macos-latest'
      run: |
        echo "macOS build is temporarily disabled"

    # ==================== LINUX BUILD (FOR THE FUTURE) ====================
    - name: Build Linux Bundle
      if: matrix.os == 'ubuntu-latest'
      run: |
        echo "Linux build is temporarily disabled"

    # ==================== PUBLISH RELEASE ====================
    - name: Upload Artifacts to Release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const tag = context.ref.replace('refs/tags/', '');
          
          let release;
          try {
            const response = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });
            release = response.data;
          } catch (error) {
            const response = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `MYOblue-GUI Release ${tag}`,
              body: 'Portable distribution package for Windows (64-bit). Extract the ZIP instantly and double-click Start_MYOblue_GUI.lnk to run.',
              draft: false,
              prerelease: false
            });
            release = response.data;
          }
          
          const filePath = path.join(process.env.GITHUB_WORKSPACE, 'MYOblue_GUI_Windows.zip');
          await github.rest.repos.uploadReleaseAsset({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: release.id,
            name: 'MYOblue_GUI_Windows.zip',
            data: fs.readFileSync(filePath)
          });
